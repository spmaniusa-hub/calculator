<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <header class="calculator-header">
            <div class="calculator-icon">✳</div>
            <h1>My Calculator</h1>
            <p class="subtitle">Simple. Fast. Accurate.</p>
        </header>

        <div class="display-container">
            <div class="display-header">
                <span class="display-label">YOUR CALCULATION</span>
                <!-- New Advanced Feature: Memory Register Status Indicator Badge -->
                <span id="memoryIndicator" class="memory-indicator" aria-label="Memory stored"></span>
            </div>
            <input type="text" id="display" value="0" readonly aria-label="Calculator display">
        </div>

        <div class="buttons">
            <!-- New Advanced Feature: Memory Register Buttons for Advanced Users (MC, MR, M+, M-) -->
            <button type="button" onclick="memoryClear()" class="memory-btn" id="memClear" aria-label="Memory Clear" title="New Advanced Feature: Memory Clear (MC)">MC</button>
            <button type="button" onclick="memoryRecall()" class="memory-btn" id="memRecall" aria-label="Memory Recall" title="New Advanced Feature: Memory Recall (MR)">MR</button>
            <button type="button" onclick="memoryAdd()" class="memory-btn" id="memAdd" aria-label="Memory Add" title="New Advanced Feature: Memory Add (M+)">M+</button>
            <button type="button" onclick="memorySubtract()" class="memory-btn" id="memSubtract" aria-label="Memory Subtract" title="New Advanced Feature: Memory Subtract (M-)">M−</button>

            <button type="button" onclick="clearDisplay()" class="clear">AC</button>
            <button type="button" onclick="addValue('7')">7</button>
            <button type="button" onclick="addValue('8')">8</button>
            <button type="button" onclick="addValue('9')">9</button>

            <button type="button" onclick="addValue('4')">4</button>
            <button type="button" onclick="addValue('5')">5</button>
            <button type="button" onclick="addValue('6')">6</button>
            <button type="button" onclick="addValue('3')">3</button>

            <button type="button" onclick="addValue('1')">1</button>
            <button type="button" onclick="addValue('2')">2</button>
            <button type="button" onclick="addValue('0')">0</button>
            <button type="button" onclick="addValue('+')" class="operator">+</button>

            <button type="button" onclick="addValue('-')" class="operator">−</button>
            <button type="button" onclick="addValue('*')" class="operator">×</button>
            <button type="button" onclick="addValue('/')" class="operator">÷</button>
            <button type="button" onclick="calculate()" class="equals">=</button>
        </div>

        <div class="calculator-footer">
            <button id="themeToggle" type="button">
                Switch to Dark Mode
            </button>
            <p>Made for everyday calculations</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
